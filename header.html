<header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4 max-w-6xl flex justify-between items-center">
        
        <a href="index.html" class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white font-black text-xs px-2.5 py-1.5 rounded-lg">JIM</div>
            <span class="text-xl font-black tracking-tight text-slate-900">JobInMinute<span class="text-blue-600">.com</span></span>
        </a>

        <nav class="hidden md:flex space-x-8 text-xs font-bold text-slate-600">
            <a href="index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="about.html" class="hover:text-blue-600 transition">About Us</a>
        </nav>

        <div class="relative" id="nav-auth-zone">
            <a href="index.html" id="logged-out-btn" class="hidden bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition">SIGN IN / REGISTER</a>

            <div id="logged-in-dropdown" class="hidden flex items-center">
                <button onclick="toggleAccountMenuMenu(event)" class="bg-slate-50 border border-slate-200 text-slate-800 text-xs font-bold px-4 py-2.5 rounded-xl flex items-center space-x-2 hover:bg-slate-100 transition focus:outline-none">
                    <i class="fa-solid fa-circle-user text-blue-600 text-sm"></i>
                    <span id="header-display-name">My Account</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                </button>

                <div id="account-popover-menu" class="hidden absolute right-0 top-12 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50">
                    <div class="px-4 py-2.5 border-b border-slate-50">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Account Identity</p>
                        <p id="popover-user-name" class="text-xs font-black text-slate-800 mt-0.5 truncate">User Profile</p>
                        <p id="popover-user-email" class="text-[11px] text-slate-400 truncate">user@mail.com</p>
                    </div>
                    <div class="p-1">
                        <button onclick="executeSessionLogout()" class="w-full text-left font-bold text-xs text-rose-600 hover:bg-rose-50 px-3 py-2 rounded-xl transition flex items-center space-x-2">
                            <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
                            <span>Terminate Session (Logout)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</header>

<script>
    function toggleAccountMenuMenu(event) {
        event.stopPropagation();
        const popover = document.getElementById('account-popover-menu');
        popover.classList.toggle('hidden');
    }

    function executeSessionLogout() {
        localStorage.removeItem("userRoleToken");
        localStorage.removeItem("loggedInUserEmail");
        localStorage.removeItem("loggedInUserName");
        alert("Session parameters dropped clean. Redirecting to home index.");
        window.location.href = "index.html";
    }

    // Initialize Header Session View States
    (function syncHeaderState() {
        const userSessionRole = localStorage.getItem("userRoleToken") || "employee";
        const email = localStorage.getItem("loggedInUserEmail") || "shishirbharti51@gmail.com";
        const name = localStorage.getItem("loggedInUserName") || "shishir bharti";

        // Always show profile dropdown on dashboard views
        document.getElementById('logged-out-btn').classList.add('hidden');
        document.getElementById('logged-in-dropdown').classList.remove('hidden');
        document.getElementById('header-display-name').innerText = name;
        document.getElementById('popover-user-name').innerText = name;
        document.getElementById('popover-user-email').innerText = email;

        window.addEventListener('click', () => {
            const popover = document.getElementById('account-popover-menu');
            if(popover) popover.classList.add('hidden');
        });
    })();
</script>
