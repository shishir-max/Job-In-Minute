<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- TOP BAR SECTION -->
    <div class="bg-slate-900 text-slate-300 text-[11px] py-2 border-b border-slate-800">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-envelope text-purple-400"></i> website-support@jobinminute.com
                </span>
            </div>
            <div class="flex items-center gap-4">
                <a href="https://linkedin.com" target="_blank" class="hover:text-purple-400 transition"><i class="fa-brands fa-linkedin text-sm"></i></a>
                <a href="https://facebook.com" target="_blank" class="hover:text-purple-400 transition"><i class="fa-brands fa-facebook text-sm"></i></a>
                <a href="https://instagram.com" target="_blank" class="hover:text-purple-400 transition"><i class="fa-brands fa-instagram text-sm"></i></a>
            </div>
        </div>
    </div>

    <!-- Header Injection Node -->
    <div id="header-node"></div>

    <!-- MAIN HERO CONTENT -->
    <main class="flex-grow flex items-center justify-center py-16">
        <div class="container mx-auto px-4 max-w-4xl text-center space-y-6">
            <span class="text-xs font-bold uppercase tracking-widest text-purple-600 bg-purple-50 px-4 py-1.5 rounded-full">
                Welcome to JobInMinute
            </span>
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight leading-none">
                Connecting Technical Experts <br>With Global Workspaces.
            </h1>
            <p class="text-sm text-slate-500 max-w-xl mx-auto leading-relaxed">
                Log in to access your direct workspace dashboard panel, configure job application matrices, or review active incoming candidates.
            </p>
            <div id="action-routing-zone" class="pt-4 flex justify-center gap-4">
                <!-- Fallback actions when no active session is loaded yet -->
                <a href="login.html" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-6 py-3 rounded-xl shadow-md transition">
                    Access Portal Gate
                </a>
            </div>
        </div>
    </main>

    <!-- Footer Injection Node -->
    <div id="footer-node"></div>

    <script>
        function setupDropdownInteractions() {
            const menuBtn = document.getElementById('user-menu-button');
            const menuDropdown = document.getElementById('logged-in-dropdown-menu');

            if (menuBtn && menuDropdown) {
                menuBtn.onclick = function(e) {
                    e.stopPropagation();
                    menuDropdown.classList.toggle('hidden');
                };
                document.addEventListener('click', function(e) {
                    if (!menuBtn.contains(e.target) && !menuDropdown.contains(e.target)) {
                        menuDropdown.classList.add('hidden');
                    }
                });
            }
        }

        async function loadLayout() {
            try {
                const h = await fetch('header.html'); 
                if(h.ok) {
                    document.getElementById('header-node').innerHTML = await h.text();
                    
                    // Detect what session is actually active
                    const currentRole = localStorage.getItem("userRoleToken");
                    let cachedEmail = "";
                    let cachedName = "";

                    if (currentRole === "employer") {
                        cachedEmail = localStorage.getItem("employerEmail") || "shishirbharti51@gmail.com";
                        cachedName = localStorage.getItem("employerName") || "Shishir Bharti";
                    } else if (currentRole === "employee") {
                        cachedEmail = localStorage.getItem("employeeEmail") || "shishirbharti51@gmail.com";
                        cachedName = localStorage.getItem("employeeName") || "Soni Singh";
                    }

                    const loggedOutBtn = document.getElementById('logged-out-btn');
                    const loggedInDropdown = document.getElementById('logged-in-dropdown');
                    const headerDisplayName = document.getElementById('header-display-name');
                    const popoverUserName = document.getElementById('popover-user-name');
                    const popoverUserEmail = document.getElementById('popover-user-email');
                    const routingZone = document.getElementById('action-routing-zone');

                    // If a valid session exists, immediately update the layout headers
                    if (currentRole && loggedOutBtn && loggedInDropdown) {
                        loggedOutBtn.classList.add('hidden');
                        loggedInDropdown.classList.remove('hidden');
                        if(headerDisplayName) headerDisplayName.innerText = cachedName;
                        if(popoverUserName) popoverUserName.innerText = cachedName;
                        if(popoverUserEmail) popoverUserEmail.innerText = cachedEmail;

                        // Dynamically change the big button in the middle to point to the correct workspace dashboard
                        if(routingZone) {
                            // FIXED FILENAMES TO PREVENT 404 SYSTEM ROUTING ISSUES
                            const destinationPage = currentRole === "employer" ? "employer-dashboard.html" : "employee-dashboard.html";
                            const themeColor = currentRole === "employer" ? "bg-purple-600 hover:bg-purple-700" : "bg-blue-600 hover:bg-blue-700";
                            routingZone.innerHTML = `
                                <a href="${destinationPage}" class="${themeColor} text-white text-xs font-bold px-6 py-3 rounded-xl shadow-md transition">
                                    Go directly to your ${currentRole === "employer" ? "Corporate Dashboard" : "Employee Workspace"} →
                                </a>
                            `;
                        }
                    }
                    setupDropdownInteractions();
                }

                const f = await fetch('footer.html'); 
                if(f.ok) document.getElementById('footer-node').innerHTML = await f.text();
            } catch(err) {
                console.error("Layout mounting context failure:", err);
            }
        }
        window.addEventListener('DOMContentLoaded', loadLayout);
    </script>
</body>
</html>
