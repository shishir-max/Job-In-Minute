<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobInMinute | Streamlined Tech Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-between">

    <div id="global-header-root"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-12 flex items-center justify-center">

        <div id="auth-panel" class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/80 border border-slate-100 p-8 dynamic-mount-transition">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Account Verification</h2>
                <p class="text-sm text-slate-500 mt-1">Access your platform workspace profile container node.</p>
            </div>

            <form id="login-form" class="space-y-5 mb-6">
                <div>
                    <label class="block text-[11px] uppercase font-bold tracking-wider text-slate-400 mb-1">Registered Email *</label>
                    <input type="email" id="login-email" required class="w-full border border-slate-200 p-3 rounded-xl text-sm bg-slate-50 outline-none focus:border-sky-500 transition-all" placeholder="name@company.com">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm py-3 rounded-xl transition-all active:scale-98 shadow-sm">
                    Send Security Access Code/Link
                </button>
            </form>

            <div class="relative flex py-2 items-center justify-center my-4">
                <span class="absolute bg-white px-3 text-xs uppercase tracking-widest font-bold text-slate-300">Or Register</span>
                <div class="w-full border-t border-slate-100"></div>
            </div>

            <form id="auth-registration-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <label class="block text-[11px] uppercase font-bold tracking-wider text-slate-400 mb-1">Employee Email</label>
                        <input type="email" id="emp-email" class="w-full border border-slate-200 p-3 rounded-xl text-sm bg-slate-50 outline-none focus:border-sky-500 transition-all" placeholder="Personal Email">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase font-bold tracking-wider text-slate-400 mb-1">Employer Email</label>
                        <input type="email" id="org-email" class="w-full border border-slate-200 p-3 rounded-xl text-sm bg-slate-50 outline-none focus:border-sky-500 transition-all" placeholder="Company Email">
                    </div>
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm py-3 rounded-xl transition-all active:scale-98 shadow-sm">
                    Create Identity Node
                </button>
            </form>
        </div>

    </main>

    <div id="global-footer-root"></div>

    <script type="module" src="firebase.js"></script>
    
    <script type="module">
        // Helper to load external component templates safely into the index layout
        async function mountExternalComponent(targetId, filePath, callbackAction) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Component fetch dropped: ${filePath}`);
                const htmlContent = await response.text();
                document.getElementById(targetId).innerHTML = htmlContent;
                if(callbackAction) callbackAction();
            } catch (err) {
                console.error("Layout mounting error exception:", err);
            }
        }

        // Initialize UI Elements when view nodes load safely
        document.addEventListener("DOMContentLoaded", () => {
            // Mount Layout Elements
            mountExternalComponent("global-header-root", "header.html", () => {
                // Link the fresh dynamic button trigger back to reveal your existing auth panel card
                const triggerBtn = document.getElementById("nav-auth-trigger");
                const targetCard = document.getElementById("auth-panel");
                if(triggerBtn && targetCard) {
                    triggerBtn.addEventListener("click", () => {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    });
                }
            });
            
            mountExternalComponent("global-footer-root", "footer.html");
        });
    </script>
</body>
</html>
