<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Routing Session...</title>
</head>
<body style="background: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="text-align: center; color: #64748b;">
        <p style="font-size: 14px; font-weight: bold;">Verifying Account Node Identity...</p>
    </div>

    <script>
        // Reads the login choice token and bounces the user to their isolated page
        const userRole = localStorage.getItem("userRoleToken") || "employee"; 
        
        if (userRole === "employer") {
            window.location.href = "employer-dashboard.html";
        } else {
            window.location.href = "employee-dashboard.html";
        }
    </script>
</body>
</html>
