<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Portal | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <div class="bg-white border-b border-slate-100 py-4 shadow-sm">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute</span>
            </div>
            <div class="flex items-center gap-6 text-sm font-bold text-slate-600">
                <a href="index.html" class="hover:text-blue-600 transition">Home</a>
                <a href="about.html" class="hover:text-blue-600 transition">About Us</a>
            </div>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white rounded-3xl p-8 max-w-xl w-full border border-slate-100 shadow-xl space-y-6">
            
            <div class="flex justify-center border-b border-slate-100 pb-2 gap-8 text-sm font-bold">
                <button id="view-tab-signin" onclick="switchViewMode('signin')" class="pb-2 text-blue-600 border-b-2 border-blue-600 transition-all">Sign In</button>
                <button id="view-tab-register" onclick="switchViewMode('register')" class="pb-2 text-slate-400 hover:text-slate-600 transition-all">Create Account</button>
            </div>

            <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                <button id="role-tab-employer" onclick="switchRole('employer')" class="w-1/2 py-2 text-xs font-bold rounded-lg text-slate-600 transition-all">
                    <i class="fa-solid fa-briefcase mr-1.5"></i>Employer
                </button>
                <button id="role-tab-candidate" onclick="switchRole('candidate')" class="w-1/2 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all">
                    <i class="fa-solid fa-user mr-1.5"></i>Candidate
                </button>
            </div>

            <form id="auth-form-flow" onsubmit="handleAuthSubmission(event)" class="space-y-4">
                
                <div id="dynamic-fields-injection-area" class="space-y-4"></div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl transition shadow-md shadow-blue-200">
                    Access Candidate Dashboard &rarr;
                </button>
            </form>

            <div class="text-center pt-2" id="forgot-password-trigger-wrapper">
                <button onclick="toggleForgotPasswordModal(true)" class="text-xs font-semibold text-slate-400 hover:text-blue-600 transition">Forgot your account password?</button>
            </div>
        </div>
    </main>

    <div id="forgot-password-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center">
                <h3 class="font-black text-base text-slate-900 tracking-tight"><i class="fa-solid fa-key text-blue-500 mr-2"></i>Account Access Recovery</h3>
                <button onclick="toggleForgotPasswordModal(false)" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">Enter your verified email profile configuration. Security micro-protocols will transmit encrypted reset directives natively to that verified inbox.</p>
            <form class="space-y-3" onsubmit="handleRecoveryFlow(event)">
                <input type="email" required placeholder="Registered Email Address" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase py-3 rounded-xl transition">Transmit Recovery Link</button>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-100 py-4 text-center text-xs text-slate-400">
        &copy; 2026 JobInMinute Security Pipeline infrastructure. All profile data securely isolated.
    </footer>

    <script>
        // System variables for authentication state tracking
        let activeViewMode = 'signin'; 
        let activeRole = 'candidate';   

        // Core user registration registry mock database
        const globalVerifiedRegistry = {
            "shishirbharti51@gmail.com": { role: "candidate", name: "Soni Singh" }
        };

        // Initialize display configuration on document execution context
        document.addEventListener("DOMContentLoaded", function() {
            renderFormLayout();
        });

        function switchViewMode(mode) {
            activeViewMode = mode;
            const btnSignIn = document.getElementById('view-tab-signin');
            const btnRegister = document.getElementById('view-tab-register');
            const forgotWrapper = document.getElementById('forgot-password-trigger-wrapper');

            if (mode === 'signin') {
                btnSignIn.className = "pb-2 text-blue-600 border-b-2 border-blue-600 transition-all";
                btnRegister.className = "pb-2 text-slate-400 hover:text-slate-600 transition-all";
                if(forgotWrapper) forgotWrapper.classList.remove('hidden');
            } else {
                btnSignIn.className = "pb-2 text-slate-400 hover:text-slate-600 transition-all";
                btnRegister.className = "pb-2 text-blue-600 border-b-2 border-blue-600 transition-all";
                if(forgotWrapper) forgotWrapper.classList.add('hidden');
            }
            renderFormLayout();
        }

        function switchRole(role) {
            activeRole = role;
            const btnEmp = document.getElementById('role-tab-employer');
            const btnCand = document.getElementById('role-tab-candidate');

            if (role === 'employer') {
                btnEmp.className = "w-1/2 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all";
                btnCand.className = "w-1/2 py-2 text-xs font-bold rounded-lg text-slate-600 transition-all";
            } else {
                btnEmp.className = "w-1/2 py-2 text-xs font-bold rounded-lg text-slate-600 transition-all";
                btnCand.className = "w-1/2 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all";
            }
            renderFormLayout();
        }

        // Structural dynamic layout architecture factory execution
        function renderFormLayout() {
            const container = document.getElementById('dynamic-fields-injection-area');
            const submitBtn = document.getElementById('auth-submit-btn');
            container.innerHTML = ""; 

            if (activeViewMode === 'signin') {
                container.innerHTML = '<div>' +
                    '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Email Address</label>' +
                    '<input type="email" id="field-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="Enter registered email...">' +
                    '</div>' +
                    '<div>' +
                    '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Password</label>' +
                    '<input type="password" id="field-pass" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="••••••••••••">' +
                    '</div>';
                
                submitBtn.innerText = activeRole === 'employer' ? "Access Employer Dashboard ➔" : "Access Candidate Dashboard ➔";
            } else {
                if (activeRole === 'candidate') {
                    container.innerHTML = '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Full Name *</label>' +
                        '<input type="text" id="reg-cand-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="e.g. Soni Singh">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Phone Number *</label>' +
                        '<input type="text" id="reg-cand-phone" required pattern="[0-9 \\-+()]+" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="Numeric value contact field">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Email ID *</label>' +
                        '<input type="email" id="reg-cand-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="candidate@domain.com">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Job Sector *</label>' +
                        '<select id="reg-cand-sector" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">' +
                        '<option value="">Select Primary Professional Core Sector</option>' +
                        '<option value="it">Information Technology (IT)</option>' +
                        '<option value="healthcare">Healthcare & Medicine</option>' +
                        '</select>' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Address (Optional)</label>' +
                        '<input type="text" id="reg-cand-addr" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="e.g. Indore, Madhya Pradesh">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Create Access Password *</label>' +
                        '<input type="password" id="reg-cand-pass" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="••••••••••••">' +
                        '</div>';
                    
                    submitBtn.innerText = "Register New Candidate Account ✓";
                } else {
                    container.innerHTML = '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Employer Name *</label>' +
                        '<input type="text" id="reg-emp-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="Authorized Personnel Full Name">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Phone Number *</label>' +
                        '<input type="text" id="reg-emp-phone" required pattern="[0-9 \\-+()]+" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="Official contact entry">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Business / Official Email ID *</label>' +
                        '<input type="email" id="reg-emp-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="corporate@company.com">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Organisation Name *</label>' +
                        '<input type="text" id="reg-emp-orgname" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="Legal Registered Entity Structural Name">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Organisation Address *</label>' +
                        '<input type="text" id="reg-emp-orgaddr" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="HQ or Corporate Branch Address Context">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Job Post Sector (Optional)</label>' +
                        '<select id="reg-emp-sector" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">' +
                        '<option value="">Select Standard Industry Context Segment</option>' +
                        '<option value="it">Information Technology (IT)</option>' +
                        '<option value="healthcare">Healthcare Systems</option>' +
                        '</select>' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Organisation Website *</label>' +
                        '<input type="url" id="reg-emp-web" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="https://www.corporate.com">' +
                        '</div>' +
                        '<div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-3">' +
                        '<span class="block font-black text-[10px] uppercase tracking-wider text-slate-400">Identity Verification Identifiers (Alphanumeric Fields)</span>' +
                        '<div>' +
                        '<label class="block text-[9px] uppercase font-bold tracking-wider text-slate-400 mb-0.5">GST Registration No. / Corporate Registration (Optional)</label>' +
                        '<input type="text" id="reg-emp-gst" pattern="[A-Za-z0-9]+" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none focus:border-blue-500 transition" placeholder="Alphanumeric Identification Formats Only">' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[9px] uppercase font-bold tracking-wider text-slate-400 mb-0.5">Business Aadhaar Identifier ID (Optional)</label>' +
                        '<input type="text" id="reg-emp-uid" pattern="[A-Za-z0-9]+" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none focus:border-blue-500 transition" placeholder="Secure alphanumeric parsing mask string">' +
                        '</div>' +
                        '</div>' +
                        '<div>' +
                        '<label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Create Corporate Access Password *</label>' +
                        '<input type="password" id="reg-emp-pass" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition" placeholder="••••••••••••">' +
                        '</div>';
                    
                    submitBtn.innerText = "Register New Employer Account ✓";
                }
            }
        }

        function handleAuthSubmission(e) {
            e.preventDefault();

            if (activeViewMode === 'signin') {
                const inputtedEmail = document.getElementById('field-email').value.trim();
                const matchedRecord = globalVerifiedRegistry[inputtedEmail];

                if (matchedRecord) {
                    if (matchedRecord.role !== activeRole) {
                        alert("Access Denied! This email profile is registered as an " + matchedRecord.role.toUpperCase() + " channel. Select the correct tab.");
                        return;
                    }
                    
                    if (activeRole === 'candidate') {
                        localStorage.setItem("userRoleToken", "employee");
                        localStorage.setItem("employeeEmail", inputtedEmail);
                        localStorage.setItem("employeeName", matchedRecord.name);
                        alert("Google Account Authentication Handshake Successful. Entering Candidate Workspace...");
                        window.location.href = "employee-dashboard.html"; 
                    } else {
                        localStorage.setItem("userRoleToken", "employer");
                        localStorage.setItem("employerEmail", inputtedEmail);
                        alert("Employer Identity Token Validated. Loading Command Center pipeline...");
                        window.location.href = "employer.html";
                    }
                } else {
                    if (activeRole === 'candidate') {
                        localStorage.setItem("userRoleToken", "employee");
                        localStorage.setItem("employeeEmail", inputtedEmail);
                        localStorage.setItem("employeeName", "Guest Applicant");
                        alert("Dynamic User Sandbox Profile Created via OAuth workflow validation.");
                        window.location.href = "employee-dashboard.html";
                    } else {
                        localStorage.setItem("userRoleToken", "employer");
                        localStorage.setItem("employerEmail", inputtedEmail);
                        alert("Dynamic Corporate Sandbox Module Setup completed successfully.");
                        window.location.href = "employer.html";
                    }
                }
            } else {
                let targetedEmail = "";
                let designatedName = "";

                if (activeRole === 'candidate') {
                    targetedEmail = document.getElementById('reg-cand-email').value.trim();
                    designatedName = document.getElementById('reg-cand-name').value.trim();
                } else {
                    targetedEmail = document.getElementById('reg-emp-email').value.trim();
                    designatedName = document.getElementById('reg-emp-name').value.trim();
                }

                globalVerifiedRegistry[targetedEmail] = {
                    role: activeRole,
                    name: designatedName
                };

                alert("Profile configuration generated securely via Authorized Global Verification. Switching to portal access view...");
                switchViewMode('signin');
            }
        }

        function toggleForgotPasswordModal(visible) {
            const modal = document.getElementById('forgot-password-modal');
            if(visible) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function handleRecoveryFlow(e) {
            e.preventDefault();
            alert("Cryptographic token dispatch script initiated. Verify your inbound mail records shortly.");
            toggleForgotPasswordModal(false);
        }
    </script>
</body>
</html>
