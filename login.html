<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="header-node"></div>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white max-w-md w-full rounded-3xl border border-slate-100 shadow-xl p-8 space-y-6">
            
            <div class="flex justify-center border-b border-slate-100 pb-4 gap-6 text-sm font-bold">
                <button id="mode-login" onclick="toggleAuthMode('login')" class="text-purple-600 border-b-2 border-purple-600 pb-2">Sign In</button>
                <button id="mode-register" onclick="toggleAuthMode('register')" class="text-slate-400 hover:text-slate-600 pb-2">Create Account</button>
            </div>

            <div class="bg-slate-100 p-1 rounded-xl grid grid-cols-2 text-xs font-bold text-center text-slate-500">
                <button id="tab-employer" onclick="switchRole('employer')" class="py-2.5 rounded-lg bg-white text-slate-900 shadow-sm">
                    <i class="fa-solid fa-building-user mr-1.5 text-purple-600"></i> Employer
                </button>
                <button id="tab-employee" onclick="switchRole('employee')" class="py-2.5 rounded-lg hover:text-slate-900">
                    <i class="fa-solid fa-user-tie mr-1.5 text-blue-500"></i> Candidate
                </button>
            </div>

            <form onsubmit="processAuth(event)" class="space-y-4">
                <div id="register-fields" class="hidden">
                    <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none" placeholder="Your Name">
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none" placeholder="name@company.com">
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-black tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-pass" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-purple-600 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl shadow-md">
                    Access Employer Dashboard →
                </button>
            </form>
        </div>
    </main>

    <div id="footer-node"></div>

    <script>
        let currentRole = 'employer';
        let authMode = 'login';

        // Simulated Accounts Database to resolve your wrong-channel glitch
        const registeredUsers = {
            "shishirbharti51@gmail.com": { role: "employer", name: "Shishir Bharti" },
            "sonisingh@jobinminute.com": { role: "employee", name: "Soni Singh" }
        };

        function toggleAuthMode(mode) {
            authMode = mode;
            document.getElementById('register-fields').classList.toggle('hidden', mode === 'login');
            document.getElementById('mode-login').className = mode === 'login' ? 'text-purple-600 border-b-2 border-purple-600 pb-2 font-bold' : 'text-slate-400 pb-2 font-bold';
            document.getElementById('mode-register').className = mode === 'register' ? 'text-purple-600 border-b-2 border-purple-600 pb-2 font-bold' : 'text-slate-400 pb-2 font-bold';
            updateButtonText();
        }

        function switchRole(role) {
            currentRole = role;
            document.getElementById('tab-employer').className = role === 'employer' ? "py-2.5 rounded-lg bg-white text-slate-900 shadow-sm" : "py-2.5 rounded-lg hover:text-slate-900";
            document.getElementById('tab-employee').className = role === 'employee' ? "py-2.5 rounded-lg bg-white text-slate-900 shadow-sm" : "py-2.5 rounded-lg hover:text-slate-900";
            
            const btn = document.getElementById('submit-btn');
            if(role === 'employer') {
                btn.className = "w-full bg-purple-600 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl shadow-md";
            } else {
                btn.className = "w-full bg-blue-600 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl shadow-md";
            }
            updateButtonText();
        }

        function updateButtonText() {
            const btn = document.getElementById('submit-btn');
            const roleName = currentRole === 'employer' ? 'Employer' : 'Candidate';
            btn.innerText = authMode === 'login' ? `Access ${roleName} Dashboard →` : `Register New ${roleName} Account ✓`;
        }

        function processAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const name = document.getElementById('auth-name').value.trim();

            if (authMode === 'register') {
                registeredUsers[email] = { role: currentRole, name: name || "New User" };
                alert("Account created successfully! Switching to sign in.");
                toggleAuthMode('login');
                return;
            }

            // Strictly check roles to prevent candidate/employer mixups
            const user = registeredUsers[email];
            if (user) {
                if (user.role !== currentRole) {
                    alert(`Access Denied! This email is registered as an ${user.role.toUpperCase()}, not a ${currentRole.toUpperCase()}. Please switch tabs.`);
                    return;
                }
                
                localStorage.setItem("userRoleToken", user.role);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userName", user.name);
                
                window.location.href = user.role === 'employer' ? "employer.html" : "employee-dashboard.html";
            } else {
                // Temporary fallback if email isn't in simulation block yet
                localStorage.setItem("userRoleToken", currentRole);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userName", currentRole === 'employer' ? "Shishir Bharti" : "Soni Singh");
                window.location.href = currentRole === 'employer' ? "employer.html" : "employee-dashboard.html";
            }
        }

        async function loadLayout() {
            const h = await fetch('header.html'); if(h.ok) document.getElementById('header-node').innerHTML = await h.text();
            const f = await fetch('footer.html'); if(f.ok) document.getElementById('footer-node').innerHTML = await f.text();
        }
        window.addEventListener('DOMContentLoaded', loadLayout);
    </script>
</body>
</html>
