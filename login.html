<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Pipeline | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
       const firebaseConfig = {
  apiKey: "AIzaSyAsgjVxoK6eJuWl-ofbL1VLEHXld13_wV0",
  authDomain: "job-in-minute.firebaseapp.com",
  projectId: "job-in-minute",
  storageBucket: "job-in-minute.firebasestorage.app",
  messagingSenderId: "507249342731",
  appId: "1:507249342731:web:0db15814ee9c454c8f0a0e"
};
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-100 py-4 shadow-sm relative z-40">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute</span>
            </div>
            <nav class="flex items-center gap-8 text-sm font-bold text-slate-600">
                <a href="index.html" class="hover:text-blue-600 transition">Home</a>
                <a href="about.html" class="hover:text-blue-600 transition">About Us</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-100 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
            
            <div class="flex border-b border-slate-100 pb-2 justify-center gap-6 text-sm font-bold text-slate-400">
                <button id="tab-signin-btn" onclick="switchFormContext('signin')" class="text-blue-600 border-b-2 border-blue-600 pb-2 transition">Sign In</button>
                <button id="tab-signup-btn" onclick="switchFormContext('signup')" class="pb-2 transition hover:text-slate-600">Create Account</button>
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-100 p-1.5 rounded-xl text-xs font-black">
                <button id="role-employer-btn" onclick="selectRoleContext('employer')" class="bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-building"></i> Employer
                </button>
                <button id="role-candidate-btn" onclick="selectRoleContext('candidate')" class="text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user"></i> Candidate
                </button>
            </div>

            <div>
                <!-- SIGN IN FORM -->
                <form id="signin-context-form" class="space-y-4" onsubmit="executeFirebaseLogin(event)">
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Email Address</label>
                        <input type="email" id="signin-email" required placeholder="name@domain.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Password</label>
                        <input type="password" id="signin-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <button type="submit" id="main-submit-cta" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase py-3.5 rounded-xl transition tracking-wider shadow-md">
                        Access Corporate Dashboard &rarr;
                    </button>
                </form>

                <!-- SIGN UP FORM -->
                <form id="signup-context-form" class="space-y-4 hidden" onsubmit="executeFirebaseRegistration(event)">
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Full Name</label>
                        <input type="text" id="signup-name" required placeholder="e.g. Shishir Bharti" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Email Address</label>
                        <input type="email" id="signup-email" required placeholder="yourname@domain.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Password</label>
                        <input type="password" id="signup-password" required placeholder="Minimum 6 characters" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase py-3.5 rounded-xl transition tracking-wider shadow-md">
                        Register Account &rarr;
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let currentActiveRole = "employer";
        let currentFormMode = "signin";

        function switchFormContext(mode) {
            currentFormMode = mode;
            if (mode === "signin") {
                document.getElementById("signin-context-form").classList.remove("hidden");
                document.getElementById("signup-context-form").classList.add("hidden");
                document.getElementById("tab-signin-btn").className = "text-blue-600 border-b-2 border-blue-600 pb-2 transition";
                document.getElementById("tab-signup-btn").className = "pb-2 transition text-slate-400";
            } else {
                document.getElementById("signup-context-form").classList.remove("hidden");
                document.getElementById("signin-context-form").classList.add("hidden");
                document.getElementById("tab-signup-btn").className = "text-blue-600 border-b-2 border-blue-600 pb-2 transition";
                document.getElementById("tab-signin-btn").className = "pb-2 transition text-slate-400";
            }
            updateButtonLabelContext();
        }

        function selectRoleContext(role) {
            currentActiveRole = role;
            if (role === "employer") {
                document.getElementById("role-employer-btn").className = "bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2";
                document.getElementById("role-candidate-btn").className = "text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2";
            } else {
                document.getElementById("role-candidate-btn").className = "bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2";
                document.getElementById("role-employer-btn").className = "text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2";
            }
            updateButtonLabelContext();
        }

        function updateButtonLabelContext() {
            const submitBtn = document.getElementById("main-submit-cta");
            if (currentFormMode === "signin") {
                submitBtn.innerText = currentActiveRole === "employer" ? "Access Corporate Dashboard →" : "Access Candidate Dashboard →";
            }
        }

        function executeFirebaseRegistration(e) {
            e.preventDefault();
            const email = document.getElementById("signup-email").value.trim();
            const password = document.getElementById("signup-password").value;
            const fullName = document.getElementById("signup-name").value.trim();

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return user.updateProfile({ displayName: fullName }).then(() => {
                        // Create user document in matching Firestore collection based on security rules
                        const collectionName = currentActiveRole === "employer" ? "employers" : "employees";
                        return db.collection(collectionName).doc(user.uid).set({
                            name: fullName,
                            email: email,
                            role: currentActiveRole,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                })
                .then(() => {
                    alert("Account saved securely to live Cloud Database!");
                    window.location.href = currentActiveRole === "employer" ? "employer-dashboard.html" : "employee-dashboard.html";
                })
                .catch(err => alert("Error: " + err.message));
        }

        function executeFirebaseLogin(e) {
            e.preventDefault();
            const email = document.getElementById("signin-email").value.trim();
            const password = document.getElementById("signin-password").value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Check Firestore collections to make sure they are logging into the right role dashboard
                    const collectionName = currentActiveRole === "employer" ? "employers" : "employees";
                    return db.collection(collectionName).doc(userCredential.user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists) {
                        window.location.href = currentActiveRole === "employer" ? "employer-dashboard.html" : "employee-dashboard.html";
                    } else {
                        alert("Role mismatch. Please select the correct account role above.");
                        auth.signOut();
                    }
                })
                .catch(err => alert("Login Failed: " + err.message));
        }
    </script>
</body>
</html>
