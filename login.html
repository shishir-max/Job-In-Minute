<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Pipeline | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // CORE INTEGRATION FRAMEWORK CONFIGURATION
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE", // Replace this with your actual Web API Key from Firebase Project Settings
            authDomain: "job-in-minute.firebaseapp.com",
            projectId: "job-in-minute",
            storageBucket: "job-in-minute.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID_HERE", // Replace with your messaging sender ID
            appId: "YOUR_APP_ID_HERE" // Replace with your actual App ID
        };
        
        // Initialize Core Firebase System
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-100 py-4 shadow-sm relative z-40">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute</span>
            </div>
            <nav class="flex items-center gap-8 text-sm font-bold text-slate-600">
                <a href="index.html" class="hover:text-blue-600 transition">Home</a>
                <a href="about.html" class="hover:text-blue-600 transition">About Us</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-100 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
            
            <div class="flex border-b border-slate-100 pb-2 justify-center gap-6 text-sm font-bold text-slate-400">
                <button id="tab-signin-btn" onclick="switchFormContext('signin')" class="text-blue-600 border-b-2 border-blue-600 pb-2 transition">Sign In</button>
                <button id="tab-signup-btn" onclick="switchFormContext('signup')" class="pb-2 transition hover:text-slate-600">Create Account</button>
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-100 p-1.5 rounded-xl text-xs font-black">
                <button id="role-employer-btn" onclick="selectRoleContext('employer')" class="bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-building"></i> Employer
                </button>
                <button id="role-candidate-btn" onclick="selectRoleContext('candidate')" class="text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user"></i> Candidate
                </button>
            </div>

            <div>
                <form id="signin-context-form" class="space-y-4" onsubmit="executeFirebaseLogin(event)">
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Corporate / Candidate Email</label>
                        <input type="email" id="signin-email" required placeholder="name@domain.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Account Secret Access Key</label>
                        <input type="password" id="signin-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <button type="submit" id="main-submit-cta" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase py-3.5 rounded-xl transition tracking-wider shadow-md">
                        Access Corporate Dashboard &rarr;
                    </button>
                </form>

                <form id="signup-context-form" class="space-y-4 hidden" onsubmit="executeFirebaseRegistration(event)">
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Full Representative Identity Name</label>
                        <input type="text" id="signup-name" placeholder="e.g. Shishir Bharti" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Target Account Operational Email Address</label>
                        <input type="email" id="signup-email" required placeholder="yourname@domain.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Secure Creation Password</label>
                        <input type="password" id="signup-password" required placeholder="Minimum 6 characters" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs outline-none focus:border-blue-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase py-3.5 rounded-xl transition tracking-wider shadow-md">
                        Provision Profile Environment &rarr;
                    </button>
                </form>
            </div>

            <div class="text-center">
                <a href="#" class="text-[11px] font-bold text-slate-400 hover:text-blue-500 transition">Forgot your account password?</a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-6 text-center text-[11px] text-slate-400">
        &copy; 2026 JobInMinute Security Pipeline infrastructure. All profile data securely isolated.
    </footer>

    <script>
        let currentActiveRole = "employer";
        let currentFormMode = "signin";

        function switchFormContext(mode) {
            currentFormMode = mode;
            const signinForm = document.getElementById("signin-context-form");
            const signupForm = document.getElementById("signup-context-form");
            const signinBtn = document.getElementById("tab-signin-btn");
            const signupBtn = document.getElementById("tab-signup-btn");

            if (mode === "signin") {
                signinForm.classList.remove("hidden");
                signupForm.classList.add("hidden");
                signinBtn.className = "text-blue-600 border-b-2 border-blue-600 pb-2 transition";
                signupBtn.className = "pb-2 transition hover:text-slate-600 text-slate-400";
            } else {
                signupForm.classList.remove("hidden");
                signinForm.classList.add("hidden");
                signupBtn.className = "text-blue-600 border-b-2 border-blue-600 pb-2 transition";
                signinBtn.className = "pb-2 transition hover:text-slate-600 text-slate-400";
            }
            updateButtonLabelContext();
        }

        function selectRoleContext(role) {
            currentActiveRole = role;
            const employerBtn = document.getElementById("role-employer-btn");
            const candidateBtn = document.getElementById("role-candidate-btn");

            if (role === "employer") {
                employerBtn.className = "bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2";
                candidateBtn.className = "text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2";
            } else {
                candidateBtn.className = "bg-white text-slate-900 shadow-sm py-2.5 rounded-lg transition flex items-center justify-center gap-2";
                employerBtn.className = "text-slate-400 py-2.5 rounded-lg transition flex items-center justify-center gap-2";
            }
            updateButtonLabelContext();
        }

        function updateButtonLabelContext() {
            const submitBtn = document.getElementById("main-submit-cta");
            if (currentFormMode === "signin") {
                submitBtn.innerText = currentActiveRole === "employer" ? "Access Corporate Dashboard →" : "Access Candidate Dashboard →";
            }
        }

        // FIREBASE INTERACTION ENGINE A: REGISTER NEW END-USERS
        function executeFirebaseRegistration(e) {
            e.preventDefault();
            const email = document.getElementById("signup-email").value.trim();
            const password = document.getElementById("signup-password").value;
            const fullName = document.getElementById("signup-name").value.trim() || "User Identity";

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Append metadata directly to display profiles list in cloud systems
                    return user.updateProfile({
                        displayName: fullName
                    }).then(() => {
                        // Bind customized access token values permanently inside Local Storage for redirection syncs
                        localStorage.setItem("userRoleToken", currentActiveRole);
                        localStorage.setItem("employerEmail", user.email);
                        localStorage.setItem("employerName", fullName);

                        alert("Account provisioned and deployed securely inside Firebase database!");
                        
                        if (currentActiveRole === "employer") {
                            window.location.href = "employer-dashboard.html";
                        } else {
                            window.location.href = "employee-dashboard.html";
                        }
                    });
                })
                .catch((error) => {
                    alert("Database Registry Failure: " + error.message);
                });
        }

        // FIREBASE INTERACTION ENGINE B: LOGIN AND INITIATE SECURED SESSION PIPELINE
        function executeFirebaseLogin(e) {
            e.preventDefault();
            const email = document.getElementById("signin-email").value.trim();
            const password = document.getElementById("signin-password").value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    // Capture active profile configurations dynamically from cloud auth state updates
                    localStorage.setItem("userRoleToken", currentActiveRole);
                    localStorage.setItem("employerEmail", user.email);
                    localStorage.setItem("employerName", user.displayName || "Corporate Member");

                    alert("Welcome back! Authentication identity verified successfully.");
                    
                    if (currentActiveRole === "employer") {
                        window.location.href = "employer-dashboard.html";
                    } else {
                        window.location.href = "employee-dashboard.html";
                    }
                })
                .catch((error) => {
                    alert("Authentication Failure: " + error.message);
                });
        }
    </script>
</body>
</html>
