<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Workspace | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAsgjVxoK6eJuWl-ofbL1VLEHXld13_wV0",
  authDomain: "job-in-minute.firebaseapp.com",
  projectId: "job-in-minute",
  storageBucket: "job-in-minute.firebasestorage.app",
  messagingSenderId: "507249342731",
  appId: "1:507249342731:web:0db15814ee9c454c8f0a0e"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white border-b py-4 shadow-sm">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <span class="font-black text-xl text-slate-900">JobInMinute Employee Panel</span>
            <button onclick="auth.signOut().then(()=>window.location.href='login.html')" class="text-xs font-bold bg-slate-100 px-4 py-2 rounded-xl">Disconnect</button>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-6xl py-8 space-y-8">
        
        <div class="bg-white p-6 rounded-3xl border shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-2">
                <input type="text" id="job-search" oninput="renderJobsMarketplace()" placeholder="Search active or closed vacancies by title keyword arrays..." class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500">
            </div>
            <div>
                <select id="sector-filter" onchange="renderJobsMarketplace()" class="w-full bg-slate-50 border rounded-xl p-3 text-xs text-slate-500">
                    <option value="all">All Sectors Selection</option>
                    <option value="it">Information Technology (IT)</option>
                    <option value="healthcare">Healthcare Operations</option>
                    <option value="education">Education</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Available Marketplace Positions</h2>
                <div id="job-listings-target" class="space-y-4"></div>
            </div>

            <div class="space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Our Applications Status Feedback</h2>
                <div id="feedback-target-box" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <div id="apply-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-title-display" class="font-black text-sm text-slate-900">Apply Form Processing</h3>
                <button onclick="toggleApplyModal(false)" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="commitApplicationSubmission(event)" class="space-y-4">
                <input type="hidden" id="target-job-id">
                <input type="hidden" id="target-employer-id">
                <input type="hidden" id="target-job-title-str">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Applicant Name Entry *</label>
                    <input type="text" id="app-name-input" required class="w-full bg-slate-50 border rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Paste Professional Experience Resume Data *</label>
                    <textarea id="app-resume-input" required rows="6" placeholder="Directly input or paste profile history documentation structures here..." class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold text-xs uppercase py-3.5 rounded-xl">Submit Application &rarr;</button>
            </form>
        </div>
    </div>

    <script>
        let candidateProfileId = "";
        let candidateProfileName = "";

        auth.onAuthStateChanged(user => {
            if (user) {
                candidateProfileId = user.uid;
                db.collection("employees").doc(user.uid).get().then(doc => {
                    if(doc.exists) {
                        candidateProfileName = doc.data().name;
                        renderJobsMarketplace();
                        renderFeedbackStream();
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function renderJobsMarketplace() {
            const container = document.getElementById("job-listings-target");
            const filterSector = document.getElementById("sector-filter").value;
            const search = document.getElementById("job-search").value.toLowerCase();
            container.innerHTML = "";

            db.collection("jobs").get().then(snap => {
                snap.forEach(doc => {
                    const job = doc.data();
                    if(filterSector !== "all" && job.sector !== filterSector) return;
                    if(search && !job.title.toLowerCase().includes(search)) return;

                    const card = document.createElement("div");
                    card.className = "bg-white p-6 rounded-2xl border shadow-sm space-y-4";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-black text-sm text-slate-900">${job.title}</h3>
                                <span class="inline-block mt-1 text-[9px] uppercase tracking-wider bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded">${job.sector.toUpperCase()}</span>
                            </div>
                            <span class="px-2 py-1 rounded text-[10px] font-black uppercase ${job.status === 'Active' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">${job.status}</span>
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-dashed">${job.description}</p>
                        <div class="pt-2 border-t flex justify-end">
                            ${job.status === 'Active' 
                                ? `<button onclick="openApplicationModal('${doc.id}', '${job.employerId}', '${job.title}')" class="bg-blue-600 text-white font-black text-[11px] px-4 py-2 rounded-xl">Apply Online</button>`
                                : `<button disabled class="bg-slate-200 text-slate-400 font-black text-[11px] px-4 py-2 rounded-xl cursor-not-allowed">Job Closed</button>`
                            }
                        </div>`;
                    container.appendChild(card);
                });
            });
        }

        function openApplicationModal(jobId, employerId, title) {
            document.getElementById("target-job-id").value = jobId;
            document.getElementById("target-employer-id").value = employerId;
            document.getElementById("target-job-title-str").value = title;
            document.getElementById("app-name-input").value = candidateProfileName;
            document.getElementById("modal-title-display").innerText = `Apply for ${title}`;
            toggleApplyModal(true);
        }

        function toggleApplyModal(show) {
            if(show) document.getElementById("apply-modal").classList.remove("hidden");
            else document.getElementById("apply-modal").classList.add("hidden");
        }

        function commitApplicationSubmission(e) {
            e.preventDefault();
            db.collection("applications").add({
                jobId: document.getElementById("target-job-id").value,
                employerId: document.getElementById("target-employer-id").value,
                jobTitle: document.getElementById("target-job-title-str").value,
                candidateId: candidateProfileId,
                candidateName: document.getElementById("app-name-input").value.trim(),
                resumeData: document.getElementById("app-resume-input").value.trim(),
                status: "Awaiting Review",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Application tracking profile processed into pipeline!");
                toggleApplyModal(false);
                document.getElementById("app-resume-input").value = "";
                renderFeedbackStream();
            });
        }

        function renderFeedbackStream() {
            const target = document.getElementById("feedback-target-box");
            target.innerHTML = "";

            db.collection("applications").where("candidateId", "==", candidateProfileId).get().then(snap => {
                if(snap.empty) {
                    target.innerHTML = `<div class="text-xs text-slate-400 text-center p-4">No active submissions logged.</div>`;
                    return;
                }
                snap.forEach(doc => {
                    const data = doc.data();
                    const node = document.createElement("div");
                    node.className = "bg-white p-4 rounded-2xl border shadow-sm flex flex-col gap-2";
                    
                    let badgeClass = "bg-amber-50 text-amber-700 border-amber-200";
                    if(data.status === "Selected") badgeClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
                    if(data.status === "Rejected") badgeClass = "bg-red-50 text-red-700 border-red-200";

                    node.innerHTML = `
                        <div class="flex justify-between items-center w-full">
                            <span class="font-bold text-xs text-slate-800 truncate mr-2">${data.jobTitle}</span>
                            <span class="border px-2.5 py-1 text-[10px] font-black uppercase rounded-lg ${badgeClass}">${data.status}</span>
                        </div>`;
                    target.appendChild(node);
                });
            });
        }
    </script>
</body>
</html>
