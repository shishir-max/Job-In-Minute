<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Panel | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
       const firebaseConfig = {
          apiKey: "AIzaSyAsgjVxoK6eJuWl-ofbL1VLEHXld13_wV0",
          authDomain: "job-in-minute.firebaseapp.com",
          projectId: "job-in-minute",
          storageBucket: "job-in-minute.firebasestorage.app",
          messagingSenderId: "507249342731",
          appId: "1:507249342731:web:0db15814ee9c454c8f0a0e"
       };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-100 shadow-sm relative z-40">
        <div class="bg-slate-900 text-white text-[11px] py-2">
            <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <span class="text-slate-400"><i class="fa-solid fa-envelope text-blue-400 mr-1"></i> info@jobinminute.com</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="https://www.facebook.com/share/1BNyCNs5A1/" target="_blank" class="hover:text-blue-400 transition">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="https://www.instagram.com/kineticssource?utm_source=qr&igsh=MWRxMWMxZWIyaTM5cw==" target="_blank" class="hover:text-pink-400 transition">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="PASTE_YOUR_LINKEDIN_URL_HERE" target="_blank" class="hover:text-blue-500 transition">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </div>
        
        <div class="container mx-auto px-4 max-w-6xl py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl"><i class="fa-solid fa-bolt text-lg"></i></div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute Employee Panel</span>
            </div>
            
            <div class="flex items-center gap-6">
                <nav class="flex items-center gap-6 text-xs font-bold text-slate-600">
                    <a href="index.html" class="hover:text-blue-600 transition flex items-center gap-1"><i class="fa-solid fa-house"></i> Home</a>
                    <a href="about.html" class="hover:text-blue-600 transition flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> About Us</a>
                </nav>

                <div class="relative inline-block text-left">
                    <button onclick="toggleEmployeeMenuDropdown()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs py-2 px-4 rounded-xl transition flex items-center gap-2">
                        <span id="user-initials-badge">EM</span>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                    </button>
                    
                    <div id="employee-profile-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-100 rounded-2xl shadow-xl py-3 z-50 space-y-2">
                        <div class="px-4 py-2 border-b border-slate-50">
                            <p id="dropdown-user-name" class="font-black text-xs text-slate-800 uppercase tracking-tight">Loading...</p>
                            <p id="dropdown-user-email" class="text-[10px] text-slate-400 truncate">loading@domain.com</p>
                        </div>
                        <a href="#" class="block px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-50 transition flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-slate-400"></i> Account Settings / Details
                        </a>
                        <button onclick="executeSignOutRoute()" class="w-full text-left block px-4 py-2 text-xs font-bold text-red-600 hover:bg-red-50 transition flex items-center gap-2">
                            <i class="fa-solid fa-right-from-bracket"></i> Disconnect Portal
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-6xl flex-grow py-8 space-y-8">
        
        <div class="bg-white border border-slate-100 rounded-3xl p-4 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div class="md:col-span-2 relative">
                <input type="text" id="vacancy-search-input" oninput="runLocalSearchFilter()" placeholder="Search active or closed vacancies by title keyword arrays..." class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-3 pl-4 text-xs outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <select id="vacancy-sector-select" onchange="runLocalSearchFilter()" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-3 text-xs outline-none focus:border-blue-500 text-slate-500 transition">
                    <option value="all">All Sectors Selection</option>
                    <option value="it">Information Technology (IT)</option>
                    <option value="healthcare">Healthcare Operations</option>
                    <option value="education">Education</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-xs font-black tracking-wider text-slate-400 uppercase">Available Marketplace Positions</h2>
                <div id="marketplace-feed-container" class="space-y-4">
                    <div class="bg-white border border-slate-100 p-6 rounded-3xl shadow-sm text-center text-xs font-bold text-slate-400 py-12">
                        Querying database engine records...
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-xs font-black tracking-wider text-slate-400 uppercase">Our Applications Status Feedback</h2>
                <div id="tracked-applications-container" class="space-y-3">
                    <div class="bg-white border border-slate-100 p-6 rounded-3xl shadow-sm text-center text-xs font-bold text-slate-400 py-8">
                        Loading application milestones...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        let cachedVacanciesArray = [];
        let currentlyAuthenticatedUserUID = null;

        // Secure Session Gateway Pipeline Monitoring Routine
        auth.onAuthStateChanged(user => {
            if (user) {
                currentlyAuthenticatedUserUID = user.uid;
                loadEmployeeAuthenticatedProfile(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        // Toggle profile dropdown menu
        function toggleEmployeeMenuDropdown() {
            const dropdown = document.getElementById("employee-profile-dropdown");
            dropdown.classList.toggle("hidden");
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById("employee-profile-dropdown");
            const button = dropdown ? dropdown.previousElementSibling : null;
            if (dropdown && button && !dropdown.contains(e.target) && !button.contains(e.target)) {
                dropdown.classList.add("hidden");
            }
        });

        // Extract credentials dataset metrics 
        function loadEmployeeAuthenticatedProfile(uid) {
            db.collection("employees").doc(uid).get()
                .then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        
                        // Parse Display Attributes Safely
                        document.getElementById("dropdown-user-name").innerText = data.name || "Employee Account";
                        document.getElementById("dropdown-user-email").innerText = data.email || "Protected Domain";
                        
                        // Generate dynamic initial badge structures
                        if (data.name) {
                            const words = data.name.trim().split(" ");
                            const initials = words.length > 1 ? (words[0][0] + words[words.length - 1][0]) : words[0][0];
                            document.getElementById("user-initials-badge").innerText = initials.toUpperCase();
                        }

                        // Initialize content aggregation pipeline loops
                        syncMarketplaceFeedRegistry();
                    } else {
                        alert("Profile Error: Security routing collision anomaly detected.");
                        executeSignOutRoute();
                    }
                })
                .catch(err => alert("Data Engine Synchronization Error: " + err.message));
        }

        // Sync Data Marketplace Elements
        function syncMarketplaceFeedRegistry() {
            db.collection("jobs").where("status", "==", "ACTIVE").get()
                .then(snapshot => {
                    cachedVacanciesArray = [];
                    snapshot.forEach(doc => {
                        cachedVacanciesArray.push({ jobId: doc.id, ...doc.data() });
                    });
                    renderFilteredMarketplaceView(cachedVacanciesArray);
                    syncTrackedApplicationsPipeline();
                })
                .catch(err => console.error("Database query processing failure: " + err.message));
        }

        // Output customized view arrays down to interface pipelines
        function renderFilteredMarketplaceView(jobs) {
            const container = document.getElementById("marketplace-feed-container");
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-100 p-8 rounded-3xl shadow-sm text-center text-xs text-slate-400 font-bold">
                        No positions matched your tracking filter queries currently.
                    </div>`;
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="bg-white border border-slate-100 p-6 rounded-3xl shadow-sm space-y-4 hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-black text-sm text-slate-900">${job.jobTitle}</h3>
                            <span class="inline-block bg-slate-100 text-slate-500 uppercase font-black tracking-wider text-[9px] px-2 py-0.5 rounded mt-1">${job.sector || "General"}</span>
                        </div>
                        <span class="bg-green-50 text-green-600 font-bold text-[9px] uppercase tracking-wider px-2 py-1 rounded-md">Active</span>
                    </div>
                    <div class="bg-slate-50 border border-dashed border-slate-200 rounded-xl p-3 text-xs text-slate-500 font-medium">
                        ${job.description || "No description requirements documentation provided."}
                    </div>
                    <div class="flex justify-end pt-1">
                        <button onclick="executeApplicationSubmission('${job.jobId}', '${job.jobTitle}')" class="bg-blue-600 hover:bg-blue-700 text-white font-black text-xs py-2 px-5 rounded-xl transition shadow-sm">
                            Apply Online
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Filter system engine
        function runLocalSearchFilter() {
            const query = document.getElementById("vacancy-search-input").value.toLowerCase().trim();
            const sector = document.getElementById("vacancy-sector-select").value;

            const filtered = cachedVacanciesArray.filter(job => {
                const matchQuery = job.jobTitle.toLowerCase().includes(query) || (job.description && job.description.toLowerCase().includes(query));
                const matchSector = sector === "all" || job.sector === sector;
                return matchQuery && matchSector;
            });

            renderFilteredMarketplaceView(filtered);
        }

        // Process application entries safely down to cloud databases
        function executeApplicationSubmission(jobId, jobTitle) {
            if (!currentlyAuthenticatedUserUID) return;

            db.collection("employees").doc(currentlyAuthenticatedUserUID).get()
                .then(empDoc => {
                    const empData = empDoc.data();
                    const appRefId = `${currentlyAuthenticatedUserUID}_${jobId}`;

                    return db.collection("applications").doc(appRefId).set({
                        applicationId: appRefId,
                        jobId: jobId,
                        jobTitle: jobTitle,
                        candidateUid: currentlyAuthenticatedUserUID,
                        candidateName: empData.name,
                        candidatePhone: empData.phone,
                        candidateEmail: empData.email,
                        candidateSector: empData.jobSector,
                        candidateAddress: empData.address,
                        status: "PENDING",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert("Application Transmitted Successfully: Your credentials are now under evaluation registry context review.");
                    syncTrackedApplicationsPipeline();
                })
                .catch(err => alert("Submission Engine Refusal: " + err.message));
        }

        // Refresh candidate tracking arrays on updates
        function syncTrackedApplicationsPipeline() {
            if (!currentlyAuthenticatedUserUID) return;

            db.collection("applications").where("candidateUid", "==", currentlyAuthenticatedUserUID).get()
                .then(snapshot => {
                    const container = document.getElementById("tracked-applications-container");
                    if (snapshot.empty) {
                        container.innerHTML = `
                            <div class="bg-white border border-slate-100 p-6 rounded-3xl text-center text-xs font-bold text-slate-400">
                                No submitted tracking files present.
                            </div>`;
                        return;
                    }

                    let trackingHtml = "";
                    snapshot.forEach(doc => {
                        const app = doc.data();
                        let badgeClass = "bg-yellow-50 text-yellow-600";
                        if (app.status === "SELECTED") badgeClass = "bg-green-50 text-green-600";
                        if (app.status === "REJECTED") badgeClass = "bg-red-50 text-red-600";

                        trackingHtml += `
                            <div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm flex justify-between items-center gap-3">
                                <span class="font-bold text-xs text-slate-800 truncate">${app.jobTitle}</span>
                                <span class="${badgeClass} font-black text-[9px] uppercase tracking-wider px-2 py-1 rounded-md shrink-0">${app.status}</span>
                            </div>`;
                    });
                    container.innerHTML = trackingHtml;
                })
                .catch(err => console.error("Tracking synchronization fault array processing engine loop break: " + err.message));
        }

        // Safe pipeline authentication clear routine
        function executeSignOutRoute() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            }).catch(err => alert("Signout routine processing exception: " + err.message));
        }
    </script>
</body>
</html>
