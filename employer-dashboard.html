<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Workspace | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyAsgjVxoK6eJuWl-ofbL1VLEHXld13_wV0",
  authDomain: "job-in-minute.firebaseapp.com",
  projectId: "job-in-minute",
  storageBucket: "job-in-minute.firebasestorage.app",
  messagingSenderId: "507249342731",
  appId: "1:507249342731:web:0db15814ee9c454c8f0a0e"
};
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-100 py-4 shadow-sm relative z-40">
        <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute</span>
            </div>
            
            <nav class="flex items-center gap-8 text-sm font-bold text-slate-600">
                <div class="relative">
                    <button onclick="toggleDropdownMenu(event)" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-900 px-4 py-2 rounded-xl transition text-xs font-black">
                        <i class="fa-solid fa-user-tie text-blue-600"></i>
                        <span id="nav-profile-display-name">Loading Profile...</span>
                    </button>
                    
                    <div id="account-dropdown-card" class="absolute right-0 mt-2 w-64 bg-white border border-slate-100 rounded-2xl shadow-2xl p-4 hidden">
                        <button onclick="executeAccountDisconnect()" class="w-full flex items-center gap-2.5 p-2 rounded-lg text-red-600 hover:bg-red-50 transition text-xs font-bold">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Disconnect Account
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-6xl flex-grow py-10 space-y-8">
        <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-900">Corporate Workspace</h1>
                <p class="text-xs text-slate-500 mt-1">Live Database Connected Pipeline.</p>
            </div>
            <button onclick="toggleJobModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase px-5 py-3.5 rounded-xl transition shadow-md">
                <i class="fa-solid fa-plus"></i> Post A New Job
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Applications</h2>
                <div id="dynamic-candidates-container" class="space-y-4">
                     <div class="bg-white rounded-2xl p-6 border text-slate-400 text-xs text-center">Select an active job posting card from the column map layout to view applicant strings.</div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Our Postings Status</h2>
                <div id="live-postings-container" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- POST JOB MODAL -->
    <div id="job-posting-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-black text-base text-slate-900">Deploy Corporate Requirement</h3>
                <button onclick="toggleJobModal(false)" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="job-posting-form" class="space-y-4" onsubmit="handleJobSubmission(event)">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Job Designation Role Title *</label>
                    <input type="text" id="modal-job-title" required class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Core Operational Description *</label>
                    <textarea id="modal-job-desc" required rows="4" class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold text-xs uppercase py-3.5 rounded-xl">Broadcast Opening Globally &rarr;</button>
            </form>
        </div>
    </div>

    <script>
        let currentUserUid = "";

        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('nav-profile-display-name').innerText = user.displayName || "Employer Account";
                fetchLiveJobs();
            } else {
                window.location.href = "login.html";
            }
        });

        function toggleDropdownMenu(e) {
            e.stopPropagation();
            document.getElementById('account-dropdown-card').classList.toggle('hidden');
        }

        function toggleJobModal(show) {
            if(show) document.getElementById('job-posting-modal').classList.remove('hidden');
            else document.getElementById('job-posting-modal').classList.add('hidden');
        }

        function handleJobSubmission(e) {
            e.preventDefault();
            const title = document.getElementById('modal-job-title').value.trim();
            const desc = document.getElementById('modal-job-desc').value.trim();

            // SAVE DATA SECURELY TO THE FIRESTORE "jobs" COLLECTION MATCHING SECURITY RULES
            db.collection("jobs").add({
                title: title,
                description: desc,
                employerId: currentUserUid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Job saved to Cloud Database successfully!");
                document.getElementById('job-posting-form').reset();
                toggleJobModal(false);
                fetchLiveJobs();
            })
            .catch(err => alert("Firestore Error: " + err.message));
        }

        function fetchLiveJobs() {
            const listingsContainer = document.getElementById('live-postings-container');
            listingsContainer.innerHTML = "";

            db.collection("jobs").where("employerId", "==", currentUserUid).get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        listingsContainer.innerHTML = `<div class='text-xs text-slate-400 text-center p-4'>No live jobs posted yet.</div>`;
                        return;
                    }
                    querySnapshot.forEach((doc) => {
                        const job = doc.data();
                        const node = document.createElement('div');
                        node.className = "bg-white rounded-2xl p-4 border border-slate-100 shadow-sm flex flex-col gap-3 cursor-pointer";
                        node.innerHTML = `
                            <div class="flex justify-between items-center w-full">
                                <span class="font-bold text-xs text-slate-800">${job.title}</span>
                                <span class="bg-blue-50 text-blue-700 px-2 py-0.5 text-[9px] uppercase font-black rounded-md">Live</span>
                            </div>
                            <div class="flex justify-end border-t pt-2">
                                <button onclick="deleteJobListing('${doc.id}')" class="text-[10px] text-slate-400 hover:text-red-500 flex items-center gap-1">
                                    <i class="fa-solid fa-trash-can"></i> Delete
                                </button>
                            </div>`;
                        listingsContainer.appendChild(node);
                    });
                });
        }

        function deleteJobListing(docId) {
            if (confirm("Delete this posting from the cloud database permanently?")) {
                db.collection("jobs").doc(docId).delete().then(() => {
                    alert("Job deleted from production servers.");
                    fetchLiveJobs();
                });
            }
        }

        function executeAccountDisconnect() {
            auth.signOut().then(() => window.location.href = "login.html");
        }
    </script>
</body>
</html>
