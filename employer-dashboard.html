<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Workspace | JobInMinute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAsgjVxoK6eJuWl-ofbL1VLEHXld13_wV0",
  authDomain: "job-in-minute.firebaseapp.com",
  projectId: "job-in-minute",
  storageBucket: "job-in-minute.firebasestorage.app",
  messagingSenderId: "507249342731",
  appId: "1:507249342731:web:0db15814ee9c454c8f0a0e"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- GLOBAL NAVIGATION ARCHITECTURE (WITH METADATA LINKS & PROFILE DROPDOWN) -->
    <header class="bg-white border-b border-slate-100 shadow-sm relative z-40">
        <!-- Social & Identity Utility Info Bar Line -->
        <div class="bg-slate-900 text-white text-[11px] py-2">
            <div class="container mx-auto px-4 max-w-6xl flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <span class="text-slate-400"><i class="fa-solid fa-envelope text-blue-400 mr-1"></i> info@jobinminute.com</span>
                </div>
                     <div class="flex items-center gap-4">
            <!-- 1. FACEBOOK: Change to your real Facebook page name -->
            <a href="https://www.facebook.com/share/1BNyCNs5A1/" target="_blank" class="hover:text-blue-400 transition">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- 2. INSTAGRAM: Change to your exact Instagram handle -->
            <a href="https://www.instagram.com/kineticssource?utm_source=qr&igsh=MWRxMWMxZWIyaTM5cw==" target="_blank" class="hover:text-pink-400 transition">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <!-- 3. LINKEDIN: Change to your company's LinkedIn page name -->
            <a href="https://linkedin.com/company/YOUR_COMPANY_LINKEDIN_NAME" target="_blank" class="hover:text-blue-500 transition">
               <i class="fa-brands fa-linkedin"></i>
            </a>
        </div>
        
        <!-- Main Dashboard Header Routing Actions Layout -->
        <div class="container mx-auto px-4 max-w-6xl py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded-xl"><i class="fa-solid fa-bolt text-lg"></i></div>
                <span class="font-black text-xl tracking-tight text-slate-900">JobInMinute Corporate Portal</span>
            </div>
            
            <div class="flex items-center gap-6">
                <nav class="flex items-center gap-6 text-xs font-bold text-slate-600 mr-4">
                    <a href="index.html" class="hover:text-blue-600 transition flex items-center gap-1"><i class="fa-solid fa-house"></i> Home</a>
                    <a href="about.html" class="hover:text-blue-600 transition flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> About Us</a>
                </nav>
                
                <!-- DYNAMIC PROFILE ACTIONS ACCORDION CONTAINER DROPDOWN -->
                <div class="relative inline-block text-left">
                    <button onclick="toggleProfileDropdown()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-black py-2 px-4 rounded-xl flex items-center gap-2 transition outline-none">
                        <i class="fa-solid fa-building-shield text-blue-600"></i> <span id="dropdown-org-name">Loading Corp Profile...</span> <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                    <div id="profile-dropdown-menu" class="hidden absolute right-0 mt-2 w-64 bg-white border border-slate-100 rounded-2xl shadow-xl py-3 z-50 text-xs text-slate-700">
                        <div class="px-4 py-2 border-b border-slate-50 mb-2">
                            <p class="font-black text-slate-900" id="menu-user-name">---</p>
                            <p class="text-[10px] text-slate-400 font-medium" id="menu-user-mail">---</p>
                        </div>
                        <button onclick="openProfileEditModal()" class="w-full text-left px-4 py-2.5 hover:bg-slate-50 transition font-bold flex items-center gap-2"><i class="fa-solid fa-sliders text-slate-400"></i> Account Settings / Details</button>
                        <hr class="my-1 border-slate-50">
                        <button onclick="auth.signOut().then(()=>window.location.href='login.html')" class="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 transition font-bold flex items-center gap-2"><i class="fa-solid fa-arrow-right-from-bracket"></i> Disconnect Portal</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-6xl py-8 space-y-6 flex-grow">
        <div class="bg-white p-6 rounded-3xl border flex flex-col md:flex-row gap-4 justify-between items-center shadow-sm">
            <input type="text" id="candidate-search" oninput="fetchApplications()" placeholder="Search candidates by name, qualification parameters..." class="bg-slate-50 border rounded-xl p-3 text-xs w-full md:max-w-md outline-none focus:border-blue-500">
            <button onclick="toggleModal(true)" class="bg-blue-600 text-white font-bold text-xs uppercase px-5 py-3 rounded-xl shadow-sm w-full md:w-auto">+ Post New Requirement</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Received Employee Applications</h2>
                <div id="applications-root-box" class="space-y-4"></div>
            </div>
            <div class="space-y-4">
                <h2 class="font-black text-xs uppercase tracking-wider text-slate-400">Our Postings Registry</h2>
                <div id="jobs-root-box" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <!-- JOB REGISTRY MANAGEMENT MODAL (POSTING & EDITING INTERACTION) -->
    <div id="job-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modal-job-headline" class="font-black text-sm text-slate-900">Deploy Corporate Job</h3>
                <button onclick="toggleModal(false)" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="job-submission-form" onsubmit="deployJobListing(event)" class="space-y-4">
                <input type="hidden" id="edit-target-job-id">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Role Designation Title *</label>
                    <input type="text" id="job-title" required class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Target Sector Requirement *</label>
                    <select id="job-sector" required class="w-full bg-slate-50 border rounded-xl p-3 text-xs text-slate-500">
                        <option value="it">IT</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="education">Education</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Job Description Core Text *</label>
                    <textarea id="job-desc" required rows="4" class="w-full bg-slate-50 border rounded-xl p-3 text-xs outline-none focus:border-blue-500"></textarea>
                </div>
                <button type="submit" id="job-modal-cta-btn" class="w-full bg-blue-600 text-white font-bold text-xs uppercase py-3.5 rounded-xl">Broadcast &rarr;</button>
            </form>
        </div>
    </div>

    <!-- CORPORATE ACCOUNT EDIT PREFERENCES MODAL -->
    <div id="profile-edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-sm text-slate-900">Update Profile Details</h3>
                <button onclick="toggleProfileModal(false)" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="commitProfileUpdates(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Representative Name</label>
                    <input type="text" id="edit-corp-name" class="w-full bg-slate-50 border rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Contact Phone No.</label>
                    <input type="text" id="edit-corp-phone" class="w-full bg-slate-50 border rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Organisation Name</label>
                    <input type="text" id="edit-corp-org" class="w-full bg-slate-50 border rounded-xl p-3 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Organisation Address</label>
                    <input type="text" id="edit-corp-addr" class="w-full bg-slate-50 border rounded-xl p-3 text-xs">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold text-xs uppercase py-3.5 rounded-xl">Save Parameters</button>
            </form>
        </div>
    </div>

    <script>
        let currentEmployerId = "";

        auth.onAuthStateChanged(user => {
            if (user) {
                currentEmployerId = user.uid;
                db.collection("employers").doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById("dropdown-org-name").innerText = data.organisationName;
                        document.getElementById("menu-user-name").innerText = data.name;
                        document.getElementById("menu-user-mail").innerText = data.email;
                        
                        // Hydrate edit inputs
                        document.getElementById("edit-corp-name").value = data.name;
                        document.getElementById("edit-corp-phone").value = data.phone;
                        document.getElementById("edit-corp-org").value = data.organisationName;
                        document.getElementById("edit-corp-addr").value = data.organisationAddress;
                    }
                });
                fetchActiveJobs();
                fetchApplications();
            } else {
                window.location.href = "login.html";
            }
        });

        function toggleProfileDropdown() {
            document.getElementById("profile-dropdown-menu").classList.toggle("hidden");
        }

        function toggleProfileModal(show) {
            if(show) document.getElementById("profile-edit-modal").classList.remove("hidden");
            else document.getElementById("profile-edit-modal").classList.add("hidden");
        }

        function openProfileEditModal() {
            toggleProfileDropdown();
            toggleProfileModal(true);
        }

        function commitProfileUpdates(e) {
            e.preventDefault();
            db.collection("employers").doc(currentEmployerId).update({
                name: document.getElementById("edit-corp-name").value.trim(),
                phone: document.getElementById("edit-corp-phone").value.trim(),
                organisationName: document.getElementById("edit-corp-org").value.trim(),
                organisationAddress: document.getElementById("edit-corp-addr").value.trim()
            }).then(() => {
                alert("Account architecture synchronized successfully.");
                window.location.reload();
            });
        }

        function toggleModal(show) {
            if(!show) {
                document.getElementById("job-modal").classList.add("hidden");
                document.getElementById("edit-target-job-id").value = "";
                document.getElementById("job-submission-form").reset();
                document.getElementById("modal-job-headline").innerText = "Deploy Corporate Job";
                document.getElementById("job-modal-cta-btn").innerText = "Broadcast →";
            } else {
                document.getElementById("job-modal").classList.remove("hidden");
            }
        }

        function deployJobListing(e) {
            e.preventDefault();
            const jobId = document.getElementById("edit-target-job-id").value;
            const payload = {
                title: document.getElementById("job-title").value.trim(),
                sector: document.getElementById("job-sector").value,
                description: document.getElementById("job-desc").value.trim(),
                employerId: currentEmployerId,
                status: "Active",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if(jobId) {
                // Perform Edit Operation Updates
                db.collection("jobs").doc(jobId).update({
                    title: payload.title,
                    sector: payload.sector,
                    description: payload.description
                }).then(() => { toggleModal(false); fetchActiveJobs(); });
            } else {
                // New Document Addition
                db.collection("jobs").add(payload).then(() => { toggleModal(false); fetchActiveJobs(); });
            }
        }

        function openEditJobForm(id, title, sector, desc) {
            document.getElementById("edit-target-job-id").value = id;
            document.getElementById("job-title").value = title;
            document.getElementById("job-sector").value = sector;
            document.getElementById("job-desc").value = desc;
            
            document.getElementById("modal-job-headline").innerText = "Modify Open Listing Requirements";
            document.getElementById("job-modal-cta-btn").innerText = "Push Modifications";
            toggleModal(true);
        }

        function fetchActiveJobs() {
            const target = document.getElementById("jobs-root-box");
            target.innerHTML = "";
            db.collection("jobs").where("employerId", "==", currentEmployerId).get().then(snap => {
                snap.forEach(doc => {
                    const job = doc.data();
                    const node = document.createElement("div");
                    node.className = "bg-white p-4 rounded-2xl border shadow-sm space-y-3";
                    node.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-slate-800">${job.title}</span>
                            <span class="px-2 py-0.5 text-[9px] uppercase font-black rounded-md ${job.status === 'Active' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">${job.status}</span>
                        </div>
                        <div class="flex justify-between border-t pt-2 gap-2">
                            <button onclick="toggleJobStatus('${doc.id}', '${job.status}')" class="text-[10px] text-blue-600 font-bold">
                                ${job.status === 'Active' ? 'Close Job' : 'Reopen Job'}
                            </button>
                            <button onclick="openEditJobForm('${doc.id}', \`${job.title}\`, '${job.sector}', \`${job.description}\`)" class="text-[10px] text-amber-600 font-bold"><i class="fa-solid fa-pen-to-square"></i> Edit Layout</button>
                            <button onclick="deleteJob('${doc.id}')" class="text-[10px] text-red-500 font-bold">Delete</button>
                        </div>`;
                    target.appendChild(node);
                });
            });
        }

        function toggleJobStatus(id, currentStatus) {
            const nextStatus = currentStatus === "Active" ? "Closed" : "Active";
            db.collection("jobs").doc(id).update({ status: nextStatus }).then(() => fetchActiveJobs());
        }

        function deleteJob(id) {
            if(confirm("Confirm system deletion processing?")) {
                db.collection("jobs").doc(id).delete().then(() => fetchActiveJobs());
            }
        }

        function fetchApplications() {
            const target = document.getElementById("applications-root-box");
            const searchVal = document.getElementById("candidate-search").value.toLowerCase();
            target.innerHTML = "";

            db.collection("applications").where("employerId", "==", currentEmployerId).get().then(snap => {
                snap.forEach(doc => {
                    const app = doc.data();
                    if(searchVal && !app.candidateName.toLowerCase().includes(searchVal)) return;

                    const node = document.createElement("div");
                    node.className = "bg-white border rounded-2xl p-4 shadow-sm space-y-3";
                    node.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <h4 class="font-black text-xs text-slate-900">${app.candidateName}</h4>
                                <p class="text-[10px] font-bold text-blue-600 mt-0.5">Applied For: ${app.jobTitle}</p>
                            </div>
                            <button onclick="document.getElementById('drop-${doc.id}').classList.toggle('hidden')" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-bold">View Application <i class="fa-solid fa-chevron-down ml-1"></i></button>
                        </div>
                        <div id="drop-${doc.id}" class="hidden bg-slate-50 p-4 rounded-xl border border-dashed space-y-4">
                            <div class="text-xs text-slate-600 font-medium whitespace-pre-line bg-white p-3 rounded-xl border">${app.resumeData}</div>
                            <div class="flex items-center justify-between border-t pt-3">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Current Decision: <strong class="text-slate-700">${app.status}</strong></span>
                                <div class="flex gap-2">
                                    <button onclick="updateDecision('${doc.id}', 'Selected')" class="bg-emerald-600 text-white font-bold text-[11px] px-3 py-1.5 rounded-lg">Select Candidate</button>
                                    <button onclick="updateDecision('${doc.id}', 'Rejected')" class="bg-red-600 text-white font-bold text-[11px] px-3 py-1.5 rounded-lg">Reject Candidate</button>
                                </div>
                            </div>
                        </div>`;
                    target.appendChild(node);
                });
            });
        }

        function updateDecision(id, decision) {
            db.collection("applications").doc(id).update({ status: decision }).then(() => {
                alert(`Candidate record updated: ${decision}`);
                fetchApplications();
            });
        }
    </script>
</body>
</html>
